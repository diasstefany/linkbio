<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#151619">
  <meta name="description" content="Stéfany Dias — links oficiais e contato.">
  <title>Stéfany Dias | Links</title>
  <style>
    :root { color-scheme: dark; --text: #f5f5f5; --muted: #b6b8be; --line: rgba(255,255,255,.18); }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: #101114; }
    body {
      margin: 0; min-height: 100svh; padding: 36px 18px 44px;
      display: grid; place-items: center; color: var(--text);
      font-family: 'Segoe UI', Arial, sans-serif;
      background: radial-gradient(ellipse 55% 45% at 50% 21%, rgba(149,151,159,.23), transparent 80%),
                  radial-gradient(ellipse 65% 55% at 10% 90%, rgba(90,93,103,.18), transparent 85%),
                  linear-gradient(135deg,#282a30 0%,#17181c 48%,#090a0c 100%);
    }
    main { width: 100%; max-width: 390px; text-align: center; }
    .portrait {
      display: block; width: 100%; height: auto; border-radius: 14px;
      box-shadow: 0 25px 65px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.10);
    }
    h1 { margin: 25px 0 5px; font-size: clamp(23px,5vw,27px); font-weight: 600; letter-spacing: .18em; line-height: 1.35; }
    .divider { width: 46px; height: 1px; margin: 15px auto 22px; background: linear-gradient(90deg,transparent,#c6c7cc,transparent); }
    nav { display: grid; gap: 12px; }
    .button {
      min-height: 54px; padding: 15px 22px; display: flex; align-items: center; justify-content: center;
      border-radius: 10px; border: 1px solid var(--line);
      color: #f8f8fa; text-decoration: none; font-size: 15px; font-weight: 600; letter-spacing: .035em;
      background: linear-gradient(120deg,rgba(105,108,117,.45),rgba(49,51,58,.76));
      box-shadow: inset 0 1px 0 rgba(255,255,255,.10), 0 7px 18px rgba(0,0,0,.13);
      transition: background .2s ease, border-color .2s ease, transform .2s ease, box-shadow .2s ease;
    }
    .button:nth-child(2) { background: linear-gradient(120deg,rgba(82,85,94,.45),rgba(37,39,45,.8)); }
    .button:nth-child(3) { background: linear-gradient(120deg,rgba(66,69,78,.55),rgba(29,31,36,.85)); }
    .button:hover, .button:focus-visible {
      transform: translateY(-2px); border-color: rgba(255,255,255,.52);
      background: linear-gradient(120deg,rgba(127,130,140,.60),rgba(67,70,79,.92));
      box-shadow: 0 11px 25px rgba(0,0,0,.23);
    }
    .button:focus-visible { outline: 2px solid #e6e7eb; outline-offset: 3px; }
    @media (max-width: 500px) { body { padding: 18px 16px 30px; } h1 { margin-top: 22px; } }
    @media (prefers-reduced-motion: reduce) { .button { transition: none; } }
  </style>
</head>
<body>
  <main>
    <img class="portrait" src="IMG-20260930-WA0129.jpg" alt="Retrato de Stéfany Dias" width="1024" height="1536">
    <h1>STÉFANY DIAS</h1>
    <div class="divider" aria-hidden="true"></div>
    <nav aria-label="Redes sociais e contato">
      <a class="button" href="https://www.instagram.com/diasstefany/">Instagram</a>
      <a class="button" href="mailto:contato@diasstefany.com.br">E-mail</a>
      <a class="button" href="https://www.tiktok.com/@diasstefany">TikTok</a>
    </nav>
  </main>
</body>
</html>
